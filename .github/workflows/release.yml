name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ''
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ''
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: mv target/${{ matrix.target }}/release/accord${{ matrix.ext }} accord-${{ matrix.target }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: accord-${{ matrix.target }}
          path: accord-${{ matrix.target }}${{ matrix.ext }}

  publish:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          api="https://api.github.com/repos/${repo}"

          # Delete existing release for this tag if present
          release_id=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            "${api}/releases/tags/${tag}" | jq -r '.id // empty')
          if [ -n "$release_id" ]; then
            echo "Deleting existing release ${release_id} for ${tag}"
            curl -s -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
              "${api}/releases/${release_id}" > /dev/null
          fi

          # Create the release
          curl -s -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            "${api}/releases" -d "{
              \"tag_name\": \"${tag}\",
              \"name\": \"${tag}\",
              \"generate_release_notes\": true
            }" > /dev/null

          # Upload each binary asset
          release_id=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            "${api}/releases/tags/${tag}" | jq -r '.id')
          for file in artifacts/accord-*; do
            name=$(basename "$file")
            echo "Uploading ${name}"
            curl -s -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              "${api}/releases/${release_id}/assets?name=${name}" \
              --data-binary "@${file}" > /dev/null
          done
          echo "Release ${tag} created with assets"
